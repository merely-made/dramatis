[workspace]
resolver = "2"
# The identity tier, out of mere since DR-D (dramatis repo plan, rulings D1,
# D7, D10, D19, D20). Secret-free: castellan, the custody crate only Djinn
# and its independently launched custodian link, stays in mere beside Djinn
# (D6, D22), and nothing here depends on a mere crate, so mere pins this
# repository and never the reverse.
members = [
    "crates/personae",
    "crates/insigne",
    "crates/gaz",
    "crates/chatelaine",
    "crates/notochord",
    "crates/dramatis",
    "crates/castellan-client",
    "crates/castellan",
    "crates/sporran",
    "crates/gazette",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/dramatis"
authors = ["Mark AB (markik)"]

[workspace.dependencies]
# ─── The tier's own crates ───────────────────────────────────────────────────
# Path + version, as in mere: the path builds here, the version is what a
# published dependent records.
personae = { version = "0.3.1", path = "crates/personae" }
insigne = { version = "0.0.2", path = "crates/insigne" }
gaz = { version = "0.0.2", path = "crates/gaz" }
chatelaine = { version = "0.0.3", path = "crates/chatelaine" }
notochord = { version = "0.1.1", path = "crates/notochord" }
dramatis = { version = "0.0.4", path = "crates/dramatis" }
castellan-client = { version = "0.0.1", path = "crates/castellan-client" }
castellan = { version = "0.0.4", path = "crates/castellan" }
sporran = { version = "0.0.1", path = "crates/sporran" }
gazette = { version = "0.0.2", path = "crates/gazette" }

# ─── The door contract (Armillary) ───────────────────────────────────────────
# castellan-client speaks over Djinn's door through ostiary, never Djinn
# (djinn-slimming D2, D3). Pinned by revision until ostiary publishes (S5).
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }

# ─── Third-party pins (the same entries as mere's) ───────────────────────────
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# The persistence floor gaz's `muniment` feature stores through. From
# crates.io rather than mere.git, so this repository never pins mere back;
# mere's `[patch.crates-io]` swaps in its own checkout so mere's graph keeps
# one muniment.
muniment = { version = ">=0.1.2, <0.3", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
eidetic = { version = "0.0.2", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "613799afd001200792e6c37d4406807848dadabc" }
base64 = "0.22"
sha2 = "0.11"
tracing = "0.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
