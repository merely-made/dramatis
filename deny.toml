# cargo-deny configuration for dramatis.
#
# No ban rules today. The custody boundary (dramatis repo plan, rulings D4 and
# D16) was a ban on `castellan` while castellan lived in mere; castellan is a
# member of this workspace now (2026-11-03), where cargo-deny cannot tell the
# crate from a dependency on it. The boundary is held by the castellan-client
# fixtures (support/fixtures/castellan-client/check.sh), which fail if the
# castellan crate, or anything that links it, enters castellan-client's cone.
#
#   cargo deny check bans

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
