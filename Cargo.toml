[workspace]
resolver = "2"
# The identity and custody tier. Castellan, Sporran and Gazette moved here
# under dramatis_repo D11-D13. D14 brings the independently launched custodian
# and its contract here. Nothing here depends on Mere or Genet.
members = [
    "crates/personae",
    "crates/insigne",
    "crates/gaz",
    "crates/chatelaine",
    "crates/notochord",
    "crates/dramatis",
    "crates/castellan-client",
    "crates/castellan",
    "crates/sporran",
    "crates/gazette",
    "crates/djinn-custodian",
    "crates/custody-wire",
    "crates/dramatis-resident",
    "crates/dramatis-surface",
]
# There is no application here: Dramatis serves `dramatis-surface` and hosts
# present it as a pane (cycle-breaks D26), so no GUI chain enters this lock.

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/dramatis"
authors = ["Mark AB (markik)"]

[workspace.dependencies]
# ─── The tier's own crates ───────────────────────────────────────────────────
# Path + version, as in mere: the path builds here, the version is what a
# published dependent records.
personae = { version = "0.3.1", path = "crates/personae" }
insigne = { version = "0.0.2", path = "crates/insigne" }
gaz = { version = "0.0.3", path = "crates/gaz" }
chatelaine = { version = "0.0.3", path = "crates/chatelaine" }
notochord = { version = "0.1.1", path = "crates/notochord" }
dramatis = { version = "0.0.5", path = "crates/dramatis" }
dramatis-surface = { version = "0.0.1", path = "crates/dramatis-surface" }
castellan-client = { version = "0.0.2", path = "crates/castellan-client" }
castellan = { version = "0.0.4", path = "crates/castellan" }
sporran = { version = "0.0.1", path = "crates/sporran" }
gazette = { version = "0.0.2", path = "crates/gazette" }

# ─── The projection contract (Graphshell's leaves) ───────────────────────────
# Family rows: Graphshell's main, the published release as the floor, so the
# surface takes the contract's current dependencies (one-version P1). All four
# come from the same source: a registry graphshell-endpoint or sceno beside a
# git chirograph would put two copies of each type in the graph. Graphshell's
# host patches graphshell.git to its checkout.
chirograph = { version = "0.0.5", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { version = "0.0.4", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["projection"] }
sceno = { version = "0.0.7", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { version = "0.0.5", git = "https://github.com/merely-made/graphshell.git", branch = "main" }

# ─── The door contract (Armillary) ───────────────────────────────────────────
# castellan-client speaks over Djinn's door through ostiary, never Djinn
# (djinn-slimming D2, D3). A family row: Armillary's main, 0.0.1 as the floor.
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
peer-facts = "0.0.1"
custody-wire = { version = "0.0.1", path = "crates/custody-wire" }

# ─── Third-party pins (the same entries as mere's) ───────────────────────────
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# The persistence floor gaz's `muniment` feature stores through. From
# crates.io rather than mere.git, so this repository never pins mere back;
# mere's `[patch.crates-io]` swaps in its own checkout so mere's graph keeps
# one muniment.
muniment = { version = "0.2.1", default-features = false }
eidetic = { version = "0.0.3", default-features = false }
base64 = "0.23"
sha2 = "0.11"
tracing = "0.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
