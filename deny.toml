# cargo-deny configuration for dramatis.
#
# No ban rules today. The custody boundary (dramatis repo plan, rulings D4 and
# D16) was a ban on `castellan` while castellan lived in mere; castellan is a
# member of this workspace now (2026-11-03), where cargo-deny cannot tell the
# crate from a dependency on it. The boundary is held by the castellan-client
# fixtures (support/fixtures/castellan-client/check.sh), which fail if the
# castellan crate, or anything that links it, enters castellan-client's cone.
#
#   cargo deny check bans

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

# The licences the app's graph uses (Mark, 2026-11-07: "deny.toml allow-list
# first"). apps/dramatis/about.toml accepts the same list for LICENSES.md, and
# package.py refuses the two drifting apart. The app is checked against this
# file: cargo deny --manifest-path apps/dramatis/Cargo.toml --config deny.toml check licenses
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
