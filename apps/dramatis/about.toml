# cargo-about: the third-party notices the installer carries (LICENSES.md),
# regenerated by `python package.py licenses`. `accepted` mirrors the
# repository deny.toml's [licenses] allow list; package.py refuses a drift.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
# Only what the shipped binary links; the app itself is under LICENSE.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
