[package]
rust-version = "1.97.1"
name = "castellan-client"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The application side of Castellan's custody route over Djinn's door: calls, answers, payloads and the custody clients."
readme = "README.md"
keywords = ["identity", "custody", "persona", "keys"]
categories = ["authentication"]

[features]
default = []
# The custody and identity clients, over the door's native client.
client = ["ostiary/native", "dep:tokio", "dep:tracing"]

[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
ostiary.workspace = true
personae.workspace = true
insigne.workspace = true
chatelaine.workspace = true
dramatis.workspace = true
eidetic = { version = "0.0.2", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
base64 = "0.22"
thiserror = "1"
zeroize = "1"
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread", "net", "time", "sync", "macros"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

