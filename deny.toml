# cargo-deny configuration for dramatis.
#
# No ban rules today. The custody boundary (dramatis repo plan, rulings D4 and
# D16) was a ban on `castellan` while castellan lived in mere; castellan is a
# member of this workspace now (2026-11-03), where cargo-deny cannot tell the
# crate from a dependency on it. The boundary is held by the castellan-client
# fixtures (support/fixtures/castellan-client/check.sh), which fail if the
# castellan crate, or anything that links it, enters castellan-client's cone.
#
#   cargo deny check bans

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"
# Two versions of one crate are a defect: move the older version's holder
# forward. Each skip is a duplicate that cannot be removed from here yet, with
# the holder that keeps it and what would remove it.
skip = [
  { crate = "getrandom@0.2.17", reason = "ring 0.17.14 (latest; castellan, and rustls) requires it; goes when ring moves on" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17.14 (latest; castellan, and rustls under gazette's reqwest 0.12) requires it; goes when ring moves to windows-sys 0.61" },
  { crate = "windows-sys@0.59.0", reason = "peer-facts 0.0.1 (armillary) requires it; goes when armillary moves peer-facts to windows-sys 0.61" },
  { crate = "base64@0.22.1", reason = "reqwest 0.12.28 (gazette) requires it; goes when gazette takes reqwest 0.13, which swaps rustls-tls for aws-lc-rs and the platform verifier, a TLS backend choice" },
  { crate = "hashbrown@0.15.5", reason = "petgraph 0.8.3 (latest) requires it, under chartulary (eidetic); goes when petgraph moves to hashbrown 0.17" },
  { crate = "syn@2.0.119", reason = "most proc-macros (zeroize_derive, zerocopy-derive, tracing-attributes, enumflags2_derive, curve25519-dalek-derive, windows-implement, munge_macro) still require syn 2; goes as they move to syn 3" },
]

# The licences the graph uses (Mark, 2026-11-07: "deny.toml allow-list
# first"). The application that once checked itself against this file with its
# own manifest is retired (cycle-breaks D26); the root workspace is checked.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
