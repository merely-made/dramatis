[package]
rust-version.workspace = true
name = "sporran"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A persona's wallet on disk: the store adapter for personae's carry model, with device grants, pairing, revocation, device settings and the wallet-sealed Muniment backend."
keywords = ["identity", "wallet", "persona", "keys"]
categories = ["authentication"]

[dependencies]
personae.workspace = true
insigne = { workspace = true, features = ["verify"] }
notochord.workspace = true
muniment.workspace = true
eidetic.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
ciborium = "0.2"
hex = "0.4"
async-trait = "0.1"
getrandom = "0.4"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }

[dev-dependencies]
tempfile = "3"
pollster = "1"

[lints]
workspace = true
