[package]
rust-version = "1.97.1"
name = "personae"
version = "0.3.1"
edition = "2024"
license.workspace = true
description = "Identity and carry primitives for the Merely ecosystem: Ed25519 keys, deterministic protocol derivation, sealed records, delegation, and public SSH certificate policy. Vault custody belongs to Castellan in the Djinn resident."
repository.workspace = true
keywords = ["identity", "ed25519", "delegation", "sealing", "p2p"]
categories = ["cryptography", "authentication"]

[lib]
path = "src/lib.rs"

# The vault, its storages, the unlock ladder, the SSH agent and the
# no-residue instrument moved to castellan, the custody crate only the
# resident links (dramatis repo plan, DR-B, rulings D3, D9 and D22). Their
# bins (`personae-agent`, `personae-vault`) went with them.

[features]
# SSH certificates from the persona: the CA, enrollment lines, face policies
# and the revocation ledger. No secret custody; the agent that serves vault
# keys is castellan's `agent` feature.
ssh = ["dep:ssh-key", "dep:gethostname"]

[dependencies]
ed25519-dalek = { version = "3", features = ["zeroize"] }
blake3 = "1.5"
# Delegation statements and attestations live in insigne; personae issues them
# and needs the checks.
insigne = { workspace = true, features = ["verify"] }
getrandom = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "2"
# Sealed records and `seal_bytes`. `zeroize` clears the cipher's copy of the
# key on drop (vault lock ruling 37).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# `ssh` feature: OpenSSH certificates and key handling.
ssh-key = { version = "0.7.0-rc.12", features = ["ed25519"], optional = true }
# Hostname for the local device id (ssh_ca self-grants). Already in the
# workspace lock via transitive deps; tiny (rustix + windows-link).
gethostname = { version = "1", optional = true }

[dev-dependencies]
rand_core = "0.10" # ssh-key test helper (PrivateKey::random)
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
tempfile = "3"

# The browser build. `getrandom` refuses `wasm32-unknown-unknown` unless told
# to use the JavaScript backend; 0.4 needs only the feature. Cargo merges a
# target table's features into the same-named entry under `[dependencies]`,
# so no native build pays for it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# `uuid` refuses the target too unless told where randomness comes from; `js`
# is its route for `wasm32-unknown-unknown`. Same merge, same name.
uuid = { version = "1", features = ["js"] }

[lints]
workspace = true
