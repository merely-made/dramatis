[package]
name = "djinn-custodian"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The independently launched Castellan custodian: the only process that opens, unlocks, locks, signs with and releases from Djinn's vault"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "djinn-custodian"
path = "src/bin/djinn-custodian.rs"

[features]
default = []
# The private C ABI the signed macOS host links (testing/macos-castellan-custodian-h1).
native-host = []
# A custodian served from a caller's thread over a synthetic vault, for test
# suites and receipt hosts (`src/fixture.rs`). Never an installed build.
fixture = []

[dependencies]
castellan = { workspace = true, features = ["keeper", "cxf"] }
chatelaine.workspace = true
custody-wire.workspace = true
dramatis.workspace = true
eidetic.workspace = true
sporran.workspace = true
ssh-key = { version = "0.7.0-rc.12", features = ["ed25519", "encryption"] }
ssh-agent-lib = { version = "0.6", git = "https://github.com/mark-ik/ssh-agent-lib.git", branch = "main" }
tokio = { version = "1", features = ["net", "rt"] }
uuid.workspace = true
insigne = { workspace = true, features = ["verify"] }
notochord.workspace = true
muniment = { workspace = true, features = ["redb"] }
pollster = "1"
personae.workspace = true
base64.workspace = true
blake3.workspace = true
getrandom = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
# The consent helper's Windows Hello prompt (`src/platform/hello.rs`).
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The signed custodian's native pieces: the consent helper's presence check
# (LocalAuthentication) and the data-protection Keychain envelope.
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAPublicDefines"] }
security-framework = { version = "3", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
