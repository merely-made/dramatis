[package]
rust-version = "1.97.1"
name = "dramatis"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Secret-free identity views, intents, receipts and roster contracts for applications using the Djinn resident."
readme = "README.md"
keywords = ["identity", "persona", "contacts", "trust", "credentials"]
categories = ["data-structures"]

[dependencies]
# The signing records the snapshot shows (ruling D25 builds them without
# personae's `agent`).
personae.workspace = true
gaz.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
