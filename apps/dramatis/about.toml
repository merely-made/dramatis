# cargo-about: the third-party notices the installer carries (LICENSES.md),
# regenerated by `python package.py licenses`. Neither Dramatis's deny.toml
# nor Mere's has a licence allow-list, so this accepts genet's list
# (repos/genet/about.toml); the app's graph needs eleven of these.
accepted = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
# Only what the shipped binary links; the app itself is under LICENSE.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
